name: Merge/Release Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  release_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # NEW STEP: Generate a dummy debug keystore for the runner so the fallback doesn't crash
    - name: Generate Dummy Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

    - name: Build Release APK and AAB
      run: ./gradlew assembleRelease bundleRelease
      env:
        CGL_HUSTLE_SUPABASE_URL: ${{ secrets.CGL_HUSTLE_SUPABASE_URL }}
        CGL_HUSTLE_SUPABASE_ANON_KEY: ${{ secrets.CGL_HUSTLE_SUPABASE_ANON_KEY }}
        GK_LLM_SUPABASE_URL: ${{ secrets.GK_LLM_SUPABASE_URL }}
        GK_LLM_SUPABASE_ANON_KEY: ${{ secrets.GK_LLM_SUPABASE_ANON_KEY }}

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*-release*.apk
        retention-days: 14

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/*-release*.aab
        retention-days: 14

    - name: Failure Notification
      if: failure()
      run: |
        echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
        echo "The CGL Hustle release build failed. Please check the logs." >> $GITHUB_STEP_SUMMARY
        echo "Job: ${{ github.job }}" >> $GITHUB_STEP_SUMMARY
        echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
